[package]
name = "bake-readme"
version = "0.2.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/base-rs/bake-readme"
description = "Reusable readme.md maintenance tasks for Bake"
readme = "readme.md"
include = ["src/**", "tests/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[lib]
name = "bake_readme"

[dependencies]
base-markdown = "0.1.0"
bake = ">=0.18.0"
serde_json = "1.0"
tempfile = "3.27"

[patch.crates-io]
bake-readme = { path = "." }
